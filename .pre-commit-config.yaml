# Installation : uv run pre-commit install --hook-type pre-commit --hook-type commit-msg
# (le hook pre-push existant, git-hooks/pre-push, joue `poe check`).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: commit-msg-conventionnel
        name: message de commit (Conventional Commits)
        entry: bash git-hooks/commit-msg
        language: system
        stages: [commit-msg]
