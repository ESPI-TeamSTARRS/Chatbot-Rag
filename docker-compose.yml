services:
  bm25-mcp:
    build: ../mcp-server
    ports:
      - "8001:8001"
    environment:
      DOCS_PATH: /app/documentations
    volumes:
      - ${DOCS_PATH:-./documentations}:/app/documentations:ro

  loki:
    image: grafana/loki:3.4.2
    profiles: ["dev"]
    ports:
      - "3100:3100"
    volumes:
      - lokidata:/loki

  app:
    build: .
    depends_on:
      - bm25-mcp
    ports:
      - "8000:8000"
    environment:
      DEBUG: ${DEBUG:-false}
      DOCS_PATH: /app/documentations
      SEARCH_MCP_URL: http://bm25-mcp:8001/mcp
      LOKI_URL: ${LOKI_URL:-http://loki:3100}
      LLM_BASE_URL: ${LLM_BASE_URL:?set LLM_BASE_URL to the OpenAI-compatible endpoint}
      LLM_MODEL: ${LLM_MODEL:?set LLM_MODEL to the model name}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:?set N8N_WEBHOOK_URL to the n8n webhook}
    volumes:
      - ${DOCS_PATH:-./documentations}:/app/documentations:ro

volumes:
  lokidata:
