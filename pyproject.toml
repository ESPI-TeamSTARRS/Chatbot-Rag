[project]
name = "chatbot-rag"
version = "0.1.0"
description = "Chatbot that maps an error trace to a documented procedure and writes an incident report"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.147.0",
    "openai>=1.0",
    "pydantic-settings>=2.16.0",
    "mcp>=1.2,<2",
    "psycopg[binary]>=3.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
chatbot-rag = "chatbot_rag.main:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "poethepoet>=0.49.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatbot_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.poe]
verbosity = 0

[tool.poe.tasks]
serve = { cmd = "chatbot-rag", help = "Start the API on port 8000 (needs LLM_BASE_URL, LLM_MODEL and a running MCP search server)" }
test = { cmd = "pytest", help = "Run every test (unit and integration)" }
test-tu = { cmd = "pytest tests/tu", help = "Run the unit tests only" }
test-ti = { cmd = "pytest tests/ti", help = "Run the integration tests only" }
check = { sequence = ["test"], help = "Run all the checks (currently the tests); used by the pre-push hook" }
