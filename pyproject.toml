[project]
name = "chatbot-rag"
version = "0.1.0"
description = "Chatbot that maps an error trace to a documented procedure and writes an incident report"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.147.0",
    "httpx>=0.28.1",
    "openai>=1.0",
    "pydantic-settings>=2.16.0",
    "mcp>=1.2,<2",
    "uvicorn>=0.54.0",
]

[project.scripts]
chatbot-rag = "chatbot_rag.main:main"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "poethepoet>=0.49.0",
    "pre-commit>=4.7.0",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chatbot_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# La longueur des lignes est laissee au formateur (les chaines longues restent telles quelles).
ignore = ["E501"]

[tool.coverage.run]
source = ["src/chatbot_rag"]

[tool.coverage.report]
fail_under = 80

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
check_untyped_defs = true

[tool.poe]
verbosity = 0

[tool.poe.tasks]
serve = { cmd = "chatbot-rag", help = "Start the API on port 8000 (needs LLM_BASE_URL, LLM_MODEL and a running MCP search server)" }
test = { cmd = "pytest", help = "Run every test (unit and integration)" }
test-tu = { cmd = "pytest tests/tu", help = "Run the unit tests only" }
test-ti = { cmd = "pytest tests/ti", help = "Run the integration tests only" }
lint = { cmd = "ruff check src tests", help = "Lint the code" }
format-check = { cmd = "ruff format --check src tests", help = "Check the formatting" }
typecheck = { cmd = "mypy src", help = "Type-check the sources" }
cov = { cmd = "pytest --cov --cov-report=term-missing --cov-report=xml", help = "Run every test with coverage (fails under 80 %)" }
audit = { shell = "uv export --frozen --no-dev --no-emit-project | uv run pip-audit --disable-pip --no-deps -r /dev/stdin", help = "Audit the runtime dependencies for known vulnerabilities" }
check = { sequence = ["lint", "format-check", "typecheck", "cov"], help = "Run all the checks (lint, format, types, tests with coverage); used by the pre-push hook and the CI" }

[tool.semantic_release]
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]
