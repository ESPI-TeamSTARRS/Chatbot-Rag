name: CI

# Tests du chatbot + build de l'image Docker + scan de secrets, en parallele.
# Chaque job appelle les taches poe du projet : jamais d'outil en direct.
# `ci-ok` est le seul check a rendre obligatoire dans la protection de branche.

on:
  push:
    # Sur main, la CI est jouee par release.yml (appel de ce workflow) avant le calcul de la version.
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Installation figee (Python epingle, sans compilation)
        run: uv sync --frozen --no-build --no-install-project --python 3.13
      - name: Verifications (lint, format, types, tests avec couverture >= 80 %)
        run: uv run poe check

  audit:
    name: pip-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --no-build --no-install-project --python 3.13
      - name: Vulnerabilites connues des dependances d'execution
        run: uv run poe audit

  docker:
    name: docker-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build de l'image
        run: docker build -t chatbot-rag:ci .

  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: gitleaks (historique complet)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact -v .

  ci-ok:
    name: ci-ok
    if: always()
    needs: [test, audit, docker, secrets-scan]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Tous les jobs bloquants sont verts
        run: |
          echo '${{ toJSON(needs) }}' | grep -q '"result": "\(failure\|cancelled\)"' && exit 1 || exit 0
