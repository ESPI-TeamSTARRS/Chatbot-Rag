name: Release

# A chaque push sur main : rejoue la CI (workflow reutilise), puis, si elle est verte, calcule la
# prochaine version semver avec python-semantic-release et pose le tag `vX.Y.Z` sur le commit de
# main. Aucun commit n'est ecrit sur main (branche protegee) : le tag est la version de reference.
# Le build et la publication de l'image sur GHCR se font dans CE workflow (un tag pousse avec
# GITHUB_TOKEN ne declenche aucun autre workflow).

on:
  push:
    branches: [main]
    # La fusion de la PR de manifeste ne change que ce fichier : rien a versionner ni a construire.
    paths-ignore: [deploy/manifest.json]
  workflow_dispatch:
    # Publie l'image d'une version deja taguee mais pas encore publiee.

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  PSR_VERSION: "9.21.0"

jobs:
  ci:
    name: ci
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  release:
    name: release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      published: ${{ steps.target.outputs.version != '' && steps.exists.outputs.skip != 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
      - name: Branche main (python-semantic-release refuse un HEAD detache)
        run: git checkout -B main "$GITHUB_SHA"
      - name: Installer python-semantic-release
        run: |
          uv venv "$RUNNER_TEMP/psr"
          uv pip install --python "$RUNNER_TEMP/psr" "python-semantic-release==$PSR_VERSION"
          echo "$RUNNER_TEMP/psr/bin" >> "$GITHUB_PATH"
      - name: Prochaine version
        id: next
        run: |
          next="$(semantic-release version --print || true)"
          echo "Prochaine version : ${next:-aucune}"
          last="$(semantic-release version --print-last-released || true)"
          if [ -n "$next" ] && [ "$next" != "$last" ]; then
            echo "version=$next" >> "$GITHUB_OUTPUT"
          fi
      - name: Tag de version
        if: steps.next.outputs.version != ''
        env:
          TAG: v${{ steps.next.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          semantic-release version --no-commit --no-changelog --no-vcs-release --no-push
          # Seul le tag part : pousser la branche echouerait si main a avance entre-temps.
          git push origin "refs/tags/$TAG"
      - name: Cible de publication
        id: target
        env:
          EVENT: ${{ github.event_name }}
          NEXT_VERSION: ${{ steps.next.outputs.version }}
        run: |
          # Nouvelle version = on construit le commit courant. Declenchement manuel sans nouvelle
          # version = on republie la derniere version taguee si son image manque.
          version="$NEXT_VERSION"
          if [ -z "$version" ] && [ "$EVENT" = workflow_dispatch ]; then
            version="$(semantic-release version --print-last-released || true)"
            [ "$version" = "0.0.0" ] && version=""
            if [ -n "$version" ]; then
              git checkout --detach "refs/tags/v$version"
            fi
          fi
          if [ -z "$version" ]; then
            echo "Rien a publier."
            exit 0
          fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$owner/chatbot-rag" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Connexion a GHCR
        if: steps.target.outputs.version != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image deja publiee ?
        id: exists
        if: steps.target.outputs.version != ''
        env:
          REF: ${{ steps.target.outputs.image }}:${{ steps.target.outputs.version }}
        run: |
          # Un tag de version est immuable : on ne republie jamais par-dessus.
          if docker buildx imagetools inspect "$REF" > /dev/null 2>&1; then
            echo "$REF existe deja, publication ignoree."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.target.outputs.version != '' && steps.exists.outputs.skip != 'true'
      - name: Build et push (provenance + SBOM)
        id: build
        if: steps.target.outputs.version != '' && steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          # Tag provisoire par commit : les tags de version ne sont poses qu'apres le scan (ci-dessous).
          tags: ${{ steps.target.outputs.image }}:sha-${{ steps.target.outputs.short_sha }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.target.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=chatbot-rag
      - name: Scan Trivy bloquant avant tout tag de version (HIGH, CRITICAL corrigeables, secrets)
        if: steps.target.outputs.version != '' && steps.exists.outputs.skip != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.target.outputs.image }}@${{ steps.build.outputs.digest }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          # Une faille sans correctif disponible ne bloque pas : on ne peut rien y faire.
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Poser les tags de version sur le digest construit
        if: steps.target.outputs.version != '' && steps.exists.outputs.skip != 'true'
        env:
          IMAGE: ${{ steps.target.outputs.image }}
          VERSION: ${{ steps.target.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          minor="${VERSION%.*}"
          docker buildx imagetools create -t "$IMAGE:$VERSION" -t "$IMAGE:$minor" -t "$IMAGE:latest" "$IMAGE@$DIGEST"
          echo "### chatbot-rag $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "$IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          # Entree du manifeste de deploiement : version + digest (jamais un tag mutable).
          jq -n --arg version "$VERSION" --arg image "$IMAGE@$DIGEST" \
            '{service: "app", version: $version, image: $image}' > "$RUNNER_TEMP/image-app.json"
      - name: Digest en artefact (entree du manifeste de deploiement)
        if: steps.target.outputs.version != '' && steps.exists.outputs.skip != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-app
          path: ${{ runner.temp }}/image-app.json
          retention-days: 90

  manifest:
    name: manifeste-de-deploiement
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    # Aucun droit par defaut : les ecritures passent par le jeton court de la GitHub App.
    permissions:
      contents: read
    env:
      BRANCH: release/manifest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image-app
          path: ${{ runner.temp }}/images
      - name: Jeton de la GitHub App
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Proposer la mise a jour du manifeste
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"

          version="$(jq -r .version "$RUNNER_TEMP/images/image-app.json")"
          image="$(jq -r .image "$RUNNER_TEMP/images/image-app.json")"
          [[ "$image" =~ @sha256:[0-9a-f]{64}$ ]] || { echo "image sans digest : $image"; exit 1; }
          title="chore(release): deploie app $version"

          git checkout -B "$BRANCH" origin/main
          mkdir -p deploy
          jq -n --arg version "$version" --arg image "$image" \
            '{schema: 1, services: {app: {version: $version, image: $image}}}' > deploy/manifest.json
          if git diff --quiet -- deploy/manifest.json && git ls-files --error-unmatch deploy/manifest.json > /dev/null 2>&1; then
            echo "Manifeste deja a jour."; exit 0
          fi
          git add deploy/manifest.json
          git commit --quiet -m "$title"
          git push --force --quiet origin "$BRANCH"

          body="Mise a jour du manifeste de deploiement : app $version ($image). Apres fusion, \`./deploy.sh\` deploie cette version."
          open_pr="$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$open_pr" ]]; then
            gh pr edit "$open_pr" --repo "$REPO" --title "$title" --body "$body"
          else
            gh pr create --repo "$REPO" --base main --head "$BRANCH" --title "$title" --body "$body"
          fi
