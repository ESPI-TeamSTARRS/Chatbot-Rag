services:
  app:
    # Image publiee par la CI, referencee par digest dans deploy/manifest.json (voir deploy.sh).
    image: ${APP_IMAGE:?lancer ./deploy.sh, image lue dans deploy/manifest.json}
    network_mode: host
    environment:
      DEBUG: ${DEBUG:-false}
      DOCS_PATH: /app/documentations
      SEARCH_MCP_URL: ${SEARCH_MCP_URL:-http://localhost:8001/mcp}
      LOKI_URL: ${LOKI_URL:?set LOKI_URL to the external Loki instance}
      LLM_BASE_URL: ${LLM_BASE_URL:?set LLM_BASE_URL to the OpenAI-compatible endpoint}
      LLM_MODEL: ${LLM_MODEL:?set LLM_MODEL to the model name}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:?set N8N_WEBHOOK_URL to the n8n webhook}
      RECIPIENT_EMAIL: ${RECIPIENT_EMAIL:?set RECIPIENT_EMAIL to the error report recipient}
    volumes:
      - ${DOCS_PATH:-./documentations}:/app/documentations:ro
